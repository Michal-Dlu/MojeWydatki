name: Testy z MySQL bez Dockera

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services: {}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Zainstaluj MySQL
        run: sudo apt-get update && sudo apt-get install -y mysql-server

      - name: Uruchom MySQL i ustaw hasło root
        run: |
          sudo service mysql start
          sudo mysqladmin -u root password 'rootpassword'
          
      - name: Utwórz bazę testową
        run: |
          mysql -u root -prootpassword -e "CREATE DATABASE IF NOT EXISTS test_db;"

      # Dodaj kolejne kroki, np. migracje, testy itp.
      - name: Uruchom testy
        run: |
          # tutaj komenda do uruchamiania testów, np.:
          ./run_tests.sh
