name: Laravel + MySQL Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      # 1️⃣ Pobranie repozytorium
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup PHP 8.4 + wymagane rozszerzenia
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, bcmath, pdo_mysql

      # 3️⃣ Wyczyść cache Composera
      - name: Clear Composer cache
        run: composer clear-cache

      # 4️⃣ Instalacja zależności
      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist

      # 5️⃣ Skopiowanie pliku .env.testing do .env
      - name: Set up .env
        run: cp .env.testing .env

      # 6️⃣ Czekanie na uruchomienie MySQL
      - name: Wait for MySQL
        run: |
          for i in {1..12}; do
            if mysqladmin ping -hmysql -uroot -proot --silent; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL..."
            sleep 5
          done

      # 7️⃣ Migracje bazy danych
      - name: Run migrations
        run: php artisan migrate:fresh --force --env=testing

      # 8️⃣ Uruchomienie testów
      - name: Run tests
        run: php artisan test --parallel --env=testing
