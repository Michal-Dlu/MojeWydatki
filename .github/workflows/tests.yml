name: Testy Laravel + MySQL

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    # MySQL uruchamiany w kontenerze jako serwis
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ''      # root bez hasła
          MYSQL_DATABASE: test_db      # nazwa bazy dla testów
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      # Pobranie kodu
      - name: Checkout repo
        uses: actions/checkout@v3

      # Instalacja PHP + potrzebnych rozszerzeń
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo_mysql

      # Instalacja zależności Composer
      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      # Skopiowanie przykładowego .env
      - name: Set up .env
        run: cp .env.example .env

      # Opcjonalnie, ustawienie danych do DB w .env (jeśli nie są już tam root + pusty password)
      - name: Configure database
        run: |
          php -r "file_put_contents('.env', str_replace('DB_DATABASE=laravel', 'DB_DATABASE=test_db', file_get_contents('.env')));"
          php -r "file_put_contents('.env', str_replace('DB_USERNAME=root', 'DB_USERNAME=root', file_get_contents('.env')));"
          php -r "file_put_contents('.env', str_replace('DB_PASSWORD=', 'DB_PASSWORD=', file_get_contents('.env')));"

      # Migracje bazy danych
      - name: Run migrations
        run: php artisan migrate --force

      # Uruchomienie testów
      - name: Run tests
        run: php artisan test
