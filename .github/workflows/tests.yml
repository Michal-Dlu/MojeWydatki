name: Laravel + MySQL Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    # 🔹 MySQL jako serwis
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        # Health check - GitHub Actions poczeka, aż kontener MySQL będzie gotowy
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    # 🔹 Ustawienie zmiennych środowiskowych dla joba
    env:
      APP_ENV: testing
      APP_DEBUG: true
      DB_CONNECTION: mysql
      DB_HOST: mysql        # <- nazwa serwisu MySQL w Actions
      DB_PORT: 3306
      DB_DATABASE: test_db
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      # 1️⃣ Pobranie repo
      - uses: actions/checkout@v4

      # 2️⃣ PHP 8.4 + wymagane rozszerzenia
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, bcmath, pdo_mysql

      # 3️⃣ Instalacja zależności Composera
      - run: composer install --no-progress --prefer-dist

      # 4️⃣ Skopiuj plik .env.testing do .env
      - run: cp .env.testing .env

      # 5️⃣ Wygeneruj APP_KEY dla środowiska testing
      - run: php artisan key:generate --env=testing

      # ❌ KROK "WAIT FOR MYSQL" usunięty, GitHub Actions sam poczeka dzięki health check

      # 6️⃣ Migracje w środowisku testing
      - run: php artisan migrate:fresh --force --env=testing

      # 7️⃣ Uruchomienie testów Laravel
      - run: php artisan test --parallel --env=testing
