name: Laravel + MySQL Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      # 1️⃣ Pobranie repozytorium
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2️⃣ PHP 8.4 + rozszerzenia
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, bcmath, pdo_mysql

      # 3️⃣ Wyczyść cache Composera
      - name: Clear Composer cache
        run: composer clear-cache

      # 4️⃣ Instalacja zależności
      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      # 5️⃣ Skopiuj plik .env.testing do .env
      - name: Set up testing environment
        run: cp .env.testing .env

      # 6️⃣ Poczekaj aż MySQL będzie gotowy
      - name: Wait for MySQL
        run: |
          echo "Waiting for MySQL to be ready..."
          until mysql -h mysql -P 3306 -uroot -proot -e "SELECT 1;" > /dev/null 2>&1; do
            echo "MySQL not ready yet..."            
            sleep 3
          done
          echo "MySQL is ready!"

      # 7️⃣ Sprawdź .env.testing
      - name: Show .env
        run: cat .env

      # 8️⃣ Migracje w środowisku testing
      - name: Run migrations
        run: php artisan migrate:fresh --force --env=testing

      # 9️⃣ Uruchomienie testów Laravel
      - name: Run tests
        run: php artisan test --parallel --env=testing
