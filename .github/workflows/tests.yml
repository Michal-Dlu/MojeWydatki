name: Laravel + MySQL Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        options: >-
          --health-cmd="mysqladmin ping -h mysql -uroot -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=40

    env:
      APP_ENV: testing
      APP_DEBUG: true
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: test_db
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, bcmath, pdo_mysql

      - run: composer install --no-progress --prefer-dist

      - run: cp .env.testing .env
      - run: php artisan key:generate --env=testing

      - run: php artisan migrate:fresh --force --env=testing
      - run: php artisan test --parallel --env=testing
