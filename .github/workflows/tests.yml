name: Testy Laravel + MySQL

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root   # hasło dla root
          MYSQL_DATABASE: test_db
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot > /dev/null 2>&1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # 1️⃣ Pobranie kodu
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2️⃣ Instalacja PHP + potrzebnych rozszerzeń
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo_mysql

      # 3️⃣ Instalacja zależności Composer
      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      # 4️⃣ Skopiowanie przykładowego .env
      - name: Set up .env
        run: cp .env.example .env

      # 5️⃣ Skonfigurowanie bazy w .env
      - name: Configure database
        run: |
          php -r "file_put_contents('.env', str_replace('DB_DATABASE=laravel', 'DB_DATABASE=test_db', file_get_contents('.env')));"
          php -r "file_put_contents('.env', str_replace('DB_USERNAME=root', 'DB_USERNAME=root', file_get_contents('.env')));"
          php -r "file_put_contents('.env', str_replace('DB_PASSWORD=', 'DB_PASSWORD=root', file_get_contents('.env')));"

      # 6️⃣ Migracje bazy danych
      - name: Run migrations
        run: php artisan migrate --force

      # 7️⃣ Uruchomienie testów
      - name: Run tests
        run: php artisan test
