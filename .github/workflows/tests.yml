name: Laravel + MySQL Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot > /dev/null 2>&1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # 1️⃣ Pobranie repozytorium
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2️⃣ PHP 8.4 + wymagane rozszerzenia
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, pdo_mysql

      # 3️⃣ Instalacja zależności Composer
      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      # 4️⃣ Skopiowanie przykładowego .env
      - name: Set up .env
        run: cp .env.example .env

      # 5️⃣ Nadpisanie zmiennych DB w .env dla CI
      - name: Configure database
        run: |
          php -r "file_put_contents('.env', str_replace('DB_CONNECTION=sqlite', 'DB_CONNECTION=mysql', file_get_contents('.env')));"
          php -r "file_put_contents('.env', str_replace('DB_DATABASE=laravel', 'DB_DATABASE=test_db', file_get_contents('.env')));"
          php -r "file_put_contents('.env', str_replace('DB_USERNAME=root', 'DB_USERNAME=root', file_get_contents('.env')));"
          php -r "file_put_contents('.env', str_replace('DB_PASSWORD=', 'DB_PASSWORD=root', file_get_contents('.env')));"
          php -r "file_put_contents('.env', str_replace('DB_HOST=127.0.0.1', 'DB_HOST=127.0.0.1', file_get_contents('.env')));"
          php -r "file_put_contents('.env', str_replace('DB_PORT=3306', 'DB_PORT=3306', file_get_contents('.env')));"

      # 6️⃣ Czekanie aż MySQL będzie gotowy
      - name: Wait for MySQL to be ready
        run: |
          until mysqladmin ping -h "127.0.0.1" -u root -proot --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done

      # 7️⃣ Migracje bazy danych w CI
      - name: Run migrations
        run: php artisan migrate --force

      # 8️⃣ Uruchomienie testów Laravel
      - name: Run tests
        run: php artisan test --parallel
