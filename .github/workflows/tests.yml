name: Laravel Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # ------------------------
  # Szybkie testy SQLite
  # ------------------------
  test-sqlite:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_DEBUG: true
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, bcmath, pdo_sqlite

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Generate app key
        run: php artisan key:generate

      - name: Run migrations (SQLite)
        run: |
          # SQLite nie obsługuje niektórych MySQL-only ALTER/DROP INDEX
          php artisan migrate --force || echo "Ignoring SQLite-specific migrations"

      - name: Run tests (SQLite)
        run: php artisan test
