name: Laravel + MySQL Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -uroot -proot" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, pdo_mysql, redis  # dodaj co potrzebujesz

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          echo "APP_ENV=testing"           >> .env
          echo "DB_CONNECTION=mysql"       >> .env
          echo "DB_HOST=127.0.0.1"         >> .env
          echo "DB_PORT=3306"              >> .env
          echo "DB_DATABASE=test_db"       >> .env
          echo "DB_USERNAME=root"          >> .env
          echo "DB_PASSWORD=root"          >> .env
          echo "CACHE_DRIVER=array"        >> .env
          echo "QUEUE_CONNECTION=sync"     >> .env

      - name: Run migrations
        run: php artisan migrate --force --ansi

      - name: Run tests
        run: php artisan test --parallel --ansi