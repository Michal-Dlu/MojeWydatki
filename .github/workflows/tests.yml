name: Laravel + MySQL Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, bcmath, pdo_mysql

      - name: Clear Composer cache
        run: composer clear-cache

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Set up .env
        run: cp .env.example .env

      - name: Wait for MySQL
        run: |
          for i in {1..12}; do
            if mysqladmin ping -hmysql -uroot -proot --silent; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL..."
            sleep 5
          done

      - name: Run migrations
        env:
          DB_HOST_LOCAL: mysql
          DB_DATABASE_LOCAL: test_db
          DB_USERNAME_LOCAL: root
          DB_PASSWORD_LOCAL: root
        run: php artisan migrate --force

      - name: Run tests
        env:
          DB_HOST_LOCAL: mysql
          DB_DATABASE_LOCAL: test_db
          DB_USERNAME_LOCAL: root
          DB_PASSWORD_LOCAL: root
        run: php artisan test --parallel
